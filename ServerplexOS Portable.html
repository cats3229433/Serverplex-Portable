<!DOCTYPE html><html><head>
<title>Dashboard</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/cats3229433/ServerplexOS/ServerplexSiteIcon.png">
</head>
<body style="margin:0;background:#0d0d1a;color:#fff;font-family:sans-serif">
<script>
(async()=>{
  const u="https://cdn.jsdelivr.net/gh/cats3229433/ServerplexOS/index.html?purge";
  try {
    const r=await fetch(u);
    let h=await r.text();
    
    // Inject base tag so all relative paths resolve to ServerplexOS on jsDelivr
    h = h.replace('<head>', '<head>\n<base href="https://cdn.jsdelivr.net/gh/cats3229433/ServerplexOS/">');
    
    document.open();
    document.write(h);
    document.close();
  } catch(e) {
    document.body.innerHTML="Load Failed<br>"+e;
  }
})();
</script>
</body></html>
